name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11

  fmt-check:
    name: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: test -z "$(gofmt -l .)"

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go test ./...

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go test -tags=integration ./...

  swagger-check:
    name: swagger-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go install github.com/swaggo/swag/cmd/swag@v1.16.6
      - run: |
          swag init -g cmd/server/main.go -o ./docs --parseInternal --outputTypes go,json,yaml
          git diff --exit-code docs/

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, fmt-check, test-unit, test-integration, swagger-check]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go build -o bin/server ./cmd/server/
